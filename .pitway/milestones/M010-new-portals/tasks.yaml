    objective: Create HR Portal project structure and config
    status: completed
    depends_on: []
    acceptance_criteria:
      - package.json with all dependencies
      - vite.config.ts, tailwind.config.js, tsconfig.json
      - index.html with FOUC prevention
      - Dockerfile + nginx.conf
