      - Toast component and ToastProvider created in financial portal
      - showToast called on mutations (violation approve/reject, settlement,
        etc.)
      - Customer portal Toast.tsx activated (already exists, just unused)
    relevant_files:
      - packages/frontend/src/components/Toast.tsx
      - packages/frontend/src/components/ToastProvider.tsx
      - packages/financial-portal/src/components/Toast.tsx
      - packages/financial-portal/src/components/ToastProvider.tsx
    verification:
      strategy: command
      detail: grep -rq showToast packages/frontend/src/ packages/customer-portal/src/
        packages/financial-portal/src/
    result:
      summary: Pending
      evidence: Pending
    usage:
      total_tokens: 0
