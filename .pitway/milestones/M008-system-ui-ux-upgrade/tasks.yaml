schema_version: 1
tasks:
  - id: T001
    objective: Add Error Boundary to All 3 Portals
    status: ready
    depends_on: []
    acceptance_criteria:
      - ErrorBoundary component created in each portal
      - Routes wrapped in ErrorBoundary in App.tsx
      - Graceful fallback UI shown on render errors
    relevant_files:
      - packages/frontend/src/components/ErrorBoundary.tsx
      - packages/frontend/src/App.tsx
      - packages/customer-portal/src/components/ErrorBoundary.tsx
      - packages/customer-portal/src/App.tsx
      - packages/financial-portal/src/components/ErrorBoundary.tsx
      - packages/financial-portal/src/App.tsx
    verification:
      strategy: command
      detail: grep -rq ErrorBoundary packages/frontend/src/
        packages/customer-portal/src/ packages/financial-portal/src/
    result:
      summary: Pending
      evidence: Pending
    usage:
      total_tokens: 0
  - id: T002
    objective: Add Toast Notification System to Admin and Financial Portals
    status: waiting
    depends_on:
