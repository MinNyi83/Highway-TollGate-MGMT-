schema_version: 1
tasks:
  - id: T001
    name: Vite + React scaffold
    objective: Initialize Vite project with React + TypeScript, configure Tailwind
      CSS, install and configure shadcn/ui.
    status: completed
    depends_on: []
    acceptance_criteria:
      - Vite dev server starts on port 5173
      - TypeScript compiles without errors
      - Tailwind CSS is configured and working
      - shadcn/ui is installed and configured
    relevant_files:
      - packages/frontend/src/**/*.tsx
      - packages/frontend/src/**/*.ts
      - packages/frontend/vite.config.ts
      - packages/frontend/tailwind.config.js
      - packages/frontend/tsconfig.json
      - packages/frontend/package.json
    verification:
      strategy: command
      detail: cd packages/frontend && npx tsc --noEmit
    result:
      summary: T001 completed. Vite + React scaffold with Tailwind CSS.
      evidence: (no output)
    attempts: 1
    usage: null
