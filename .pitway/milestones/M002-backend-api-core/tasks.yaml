schema_version: 1
tasks:
  - id: T001
    name: Auth module (JWT register, login, refresh, middleware)
    objective: Implement JWT authentication with register, login, refresh token
      endpoints, and auth middleware for protected routes.
    status: completed
    depends_on: []
    acceptance_criteria:
      - POST /api/auth/register creates user and returns JWT
      - POST /api/auth/login validates credentials and returns JWT
      - POST /api/auth/refresh refreshes expired token
      - Auth middleware validates JWT on protected routes
      - Password hashing with bcryptjs
    relevant_files:
      - packages/backend/src/modules/auth/auth.routes.ts
      - packages/backend/src/modules/auth/auth.service.ts
      - packages/backend/src/middleware/auth.ts
      - packages/backend/src/utils/jwt.ts
    verification:
      strategy: command
      detail: cd packages/backend && npx tsc --noEmit
    result:
      summary: T001 completed. JWT auth module with register, login, refresh endpoints
        and auth middleware.
      evidence: (no output)
    attempts: 1
    usage: null
