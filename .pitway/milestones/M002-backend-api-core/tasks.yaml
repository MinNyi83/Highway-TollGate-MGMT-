    name: User and Account management CRUD
    objective: Implement CRUD endpoints for users and accounts with balance top-up
      functionality.
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - GET /api/users returns list of users
      - GET /api/users/:id returns single user
      - PUT /api/users/:id updates user
      - GET /api/accounts returns list of accounts
      - GET /api/accounts/:id returns single account with balance
      - POST /api/accounts/:id/topup adds balance to account
    relevant_files:
      - packages/backend/src/modules/users/users.routes.ts
      - packages/backend/src/modules/users/users.service.ts
      - packages/backend/src/modules/accounts/accounts.routes.ts
