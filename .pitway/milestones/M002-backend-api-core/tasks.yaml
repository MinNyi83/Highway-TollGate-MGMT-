  - id: T005
    name: Toll Event processing with cross-verification
    objective: Implement toll event creation with RFID/ANPR cross-verification logic.
    status: completed
    depends_on:
      - T003
      - T004
    acceptance_criteria:
      - POST /api/toll-events creates entry event
      - PUT /api/toll-events/:id/exit completes exit event
      - Cross-verification matches RFID tag plate against ANPR plate
      - Mismatch triggers violation creation
      - Event status transitions from ENTRY to EXIT to COMPLETED
    relevant_files:
      - packages/backend/src/modules/toll-events/toll-events.routes.ts
      - packages/backend/src/modules/toll-events/toll-events.service.ts
    verification:
      strategy: command
