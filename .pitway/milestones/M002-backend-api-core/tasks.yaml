      - GET /api/vehicles/:id returns vehicle with RFID tags
      - PUT /api/vehicles/:id updates vehicle
      - POST /api/vehicles/:id/rfid binds RFID tag to vehicle
      - DELETE /api/vehicles/:id/rfid/:tagId unbinds RFID tag
    relevant_files:
