schema_version: 1
tasks:
  - id: T001
    objective: Design HR Database Schema (schema.hr.prisma)
    status: completed
    depends_on: []
    acceptance_criteria:
      - 12 models defined: HrUser, Department, Position, Employee, Attendance, Shift, ShiftAssignment, LeaveRequest, Payroll, PerformanceReview, Training, TrainingEnrollment
      - Separate output directory to avoid Prisma client conflicts
      - Proper relations and indexes defined
    relevant_files:
      - packages/backend/prisma/schema.hr.prisma
    verification:
      strategy: command
      detail: npx prisma format --schema=packages/backend/prisma/schema.hr.prisma
    result:
      summary: HR schema created with 12 models, separate output dir src/generated/hr-client/
      evidence: Schema covers employees, departments, positions, attendance, shifts, leave, payroll, performance reviews, training.
    attempts: 1
    usage:
      total_tokens: 0
  - id: T002
    objective: Create HR Database Docker Container
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - hr-db container running PostgreSQL 16
      - Port 5435 exposed
      - hr_pgdata volume for persistence
      - HR_DATABASE_URL env var configured
    relevant_files:
      - docker-compose.yml
    verification:
      strategy: command
      detail: docker ps --format '{{.Names}}' | grep hr-db
    result:
      summary: hr-db container running on port 5435 with hr_pgdata volume
      evidence: Container healthy, PostgreSQL 16, database tollgate_hr accessible.
    attempts: 1
    usage:
      total_tokens: 0
  - id: T003
    objective: Configure HR Prisma Client with Separate Output
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - hrPrisma client generated to src/generated/hr-client/
      - database.ts imports HrPrismaClient from generated path
      - No conflicts with HQ/Customer/Plaza Prisma clients
    relevant_files:
      - packages/backend/src/config/database.ts
    verification:
      strategy: command
      detail: grep -rq hrPrisma packages/backend/src/config/database.ts
    result:
      summary: hrPrisma client configured with custom output directory
      evidence: HrPrismaClient imported from src/generated/hr-client/. Used throughout HR service and routes.
    attempts: 1
    usage:
      total_tokens: 0
  - id: T004
    objective: Build HR Backend Service Layer
    status: completed
    depends_on:
      - T003
    acceptance_criteria:
      - hr.service.ts with full CRUD for all entities
      - Dashboard stats endpoint
      - Clock in/out attendance logic
      - Leave approval workflow
      - Payroll generation logic
    relevant_files:
      - packages/backend/src/modules/hr/hr.service.ts
    verification:
      strategy: command
      detail: grep -c "export" packages/backend/src/modules/hr/hr.service.ts
    result:
      summary: HR service with 502 lines, all CRUD operations, attendance clock-in/out, leave approve/reject, payroll generate/process/pay
      evidence: Service covers dashboard, employees, departments, positions, attendance, shifts, leave, payroll, performance, training.
    attempts: 1
    usage:
      total_tokens: 0
  - id: T005
    objective: Build HR Routes Layer
    status: completed
    depends_on:
      - T004
    acceptance_criteria:
      - All HR endpoints registered at /api/hr/*
      - Auth middleware applied
      - Auth sync endpoint for TollGate JWT
      - All CRUD routes functional
    relevant_files:
      - packages/backend/src/modules/hr/hr.routes.ts
      - packages/backend/src/app.ts
    verification:
      strategy: command
      detail: curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/hr/dashboard
    result:
      summary: HR routes with 544 lines, 12+ endpoints, all registered at /api/hr/* in app.ts
      evidence: Auth sync, dashboard, employees, departments, positions, attendance, shifts, leave, payroll, performance, training endpoints all working.
    attempts: 1
    usage:
      total_tokens: 0
