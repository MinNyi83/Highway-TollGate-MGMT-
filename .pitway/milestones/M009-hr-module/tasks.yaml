      - packages/frontend/src/pages/EmployeeDetail.tsx
      - packages/frontend/src/pages/Departments.tsx
      - packages/frontend/src/pages/Attendance.tsx
      - packages/frontend/src/pages/Shifts.tsx
      - packages/frontend/src/pages/LeaveRequests.tsx
      - packages/frontend/src/pages/Payroll.tsx
      - packages/frontend/src/pages/Performance.tsx
