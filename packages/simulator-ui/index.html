<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TollGate Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; overflow-x: hidden; }
    
    .header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header h1 span { color: #3b82f6; }
    
    .container { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 60px); }
    
    /* Highway Canvas */
    .highway-container { position: relative; background: #1a1a2e; overflow: hidden; }
    .highway-canvas { width: 100%; height: 100%; }
    
    /* Side Panel */
    .side-panel { background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; }
    .panel-section { padding: 16px; border-bottom: 1px solid #334155; }
    .panel-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #94a3b8; margin-bottom: 12px; }
    
    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card { background: #0f172a; border-radius: 8px; padding: 12px; }
    .stat-label { font-size: 11px; color: #64748b; }
    .stat-value { font-size: 20px; font-weight: 700; color: #f8fafc; }
    .stat-value.green { color: #22c55e; }
    .stat-value.blue { color: #3b82f6; }
    .stat-value.yellow { color: #eab308; }
    .stat-value.red { color: #ef4444; }
    
    /* Controls */
    .control-group { margin-bottom: 12px; }
    .control-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .control-row { display: flex; gap: 8px; }
    
    select, input[type="number"], input[type="text"] {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 8px 12px; color: #e2e8f0; font-size: 13px; width: 100%;
    }
    select:focus, input:focus { outline: none; border-color: #3b82f6; }
    
    .btn { padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-group { display: flex; gap: 8px; }
    .btn-full { flex: 1; }
    
    /* Event Log */
    .event-log { flex: 1; overflow-y: auto; padding: 12px; }
    .event-item { 
      background: #0f172a; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
      border-left: 3px solid #3b82f6; font-size: 12px;
    }
    .event-item.entry { border-left-color: #22c55e; }
    .event-item.exit { border-left-color: #3b82f6; }
    .event-item.violation { border-left-color: #ef4444; }
    .event-item.rfid { border-left-color: #eab308; }
    .event-time { color: #64748b; font-size: 11px; }
    .event-plate { font-weight: 600; color: #f8fafc; }
    .event-detail { color: #94a3b8; }
    .event-amount { color: #22c55e; font-weight: 600; }
    
    /* Legend */
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #94a3b8; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    
    /* Speed Control */
    .speed-control { display: flex; align-items: center; gap: 8px; }
    .speed-label { font-size: 12px; color: #94a3b8; min-width: 50px; }
    .speed-slider { flex: 1; -webkit-appearance: none; height: 4px; background: #334155; border-radius: 2px; }
    .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; cursor: pointer; }
    
    /* Responsive */
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .side-panel { height: 400px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>TollGate</span> Simulator</h1>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>RFID Read</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Entry</div>
      <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div>ANPR Scan</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>Violation</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Payment</div>
    </div>
  </div>
  
  <div class="container">
    <div class="highway-container">
      <canvas id="highway" class="highway-canvas"></canvas>
    </div>
    
    <div class="side-panel">
      <div class="panel-section">
        <div class="panel-title">Statistics</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Vehicles</div>
            <div class="stat-value blue" id="stat-vehicles">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Revenue</div>
            <div class="stat-value green" id="stat-revenue">K 0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">On Highway</div>
            <div class="stat-value yellow" id="stat-onhighway">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Violations</div>
            <div class="stat-value red" id="stat-violations">0</div>
          </div>
        </div>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">Controls</div>
        <div class="control-group">
          <div class="control-label">Scenario</div>
          <select id="scenario">
            <option value="normal">Normal Traffic</option>
            <option value="rush">Rush Hour</option>
            <option value="holiday">Holiday Traffic</option>
            <option value="night">Night Mode</option>
          </select>
        </div>
        <div class="control-group">
          <div class="control-label">Vehicle Count</div>
          <input type="number" id="vehicleCount" value="20" min="5" max="100">
        </div>
        <div class="control-group">
          <div class="control-label">Speed</div>
          <div class="speed-control">
            <span class="speed-label">Slow</span>
            <input type="range" id="speed" class="speed-slider" min="1" max="5" value="3">
            <span class="speed-label">Fast</span>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary btn-full" id="btnStart">Start</button>
          <button class="btn btn-danger btn-full" id="btnStop" disabled>Stop</button>
          <button class="btn btn-success btn-full" id="btnPause" disabled>Pause</button>
        </div>
      </div>
      
      <div class="panel-section" style="padding-bottom: 0;">
        <div class="panel-title">Event Log</div>
      </div>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <script src="/src/simulator.js"></script>
</body>
</html>
