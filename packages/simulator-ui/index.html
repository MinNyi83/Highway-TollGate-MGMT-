<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TollGate Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .header { background: #1e293b; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; height: 42px; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header h1 span { color: #3b82f6; }
    .back-btn { background: #334155; color: #94a3b8; border: none; padding: 5px 12px; border-radius: 5px; font-size: 11px; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px; transition: all 0.15s; }
    .back-btn:hover { background: #475569; color: #e2e8f0; }
    .legend { display: flex; gap: 10px; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #94a3b8; }
    .legend-dot { width: 6px; height: 6px; border-radius: 50%; }

    .highway-wrap { flex: 1; position: relative; background: #0f172a; min-height: 0; }
    .highway-canvas { width: 100%; height: 100%; display: block; }

    .bottom-bar { background: #1e293b; border-top: 1px solid #334155; display: flex; height: 120px; flex-shrink: 0; overflow: hidden; }

    .left-panel { width: 340px; padding: 8px 12px; border-right: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; overflow: hidden; flex-shrink: 0; }
    .section-title { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; }

    .stats-row { display: flex; gap: 4px; }
    .stat-card { background: #0f172a; border-radius: 4px; padding: 4px 6px; flex: 1; text-align: center; }
    .stat-label { font-size: 8px; color: #64748b; text-transform: uppercase; }
    .stat-value { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .stat-value.green { color: #22c55e; }
    .stat-value.blue { color: #3b82f6; }
    .stat-value.yellow { color: #eab308; }
    .stat-value.red { color: #ef4444; }

    .ctrl-row { display: flex; gap: 6px; align-items: flex-end; }
    .ctrl-group { display: flex; flex-direction: column; gap: 2px; }
    .ctrl-label { font-size: 8px; color: #64748b; text-transform: uppercase; }
    select, input[type="number"] { background: #0f172a; border: 1px solid #334155; border-radius: 3px; padding: 4px 6px; color: #e2e8f0; font-size: 11px; }
    select:focus, input:focus { outline: none; border-color: #3b82f6; }
    .speed-row { display: flex; align-items: center; gap: 4px; }
    .speed-slider { width: 60px; -webkit-appearance: none; height: 3px; background: #334155; border-radius: 2px; }
    .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; cursor: pointer; }
    .speed-lbl { font-size: 9px; color: #64748b; }
    .btn { padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .log-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .log-header { padding: 6px 10px 0; flex-shrink: 0; }
    .event-log { flex: 1; overflow-y: auto; padding: 4px 10px 6px; display: flex; flex-direction: column; gap: 3px; }
    .event-item { background: #0f172a; border-radius: 3px; padding: 3px 6px; border-left: 2px solid #3b82f6; font-size: 10px; flex-shrink: 0; display: flex; gap: 8px; align-items: center; }
    .event-item.entry { border-left-color: #22c55e; }
    .event-item.exit { border-left-color: #8b5cf6; }
    .event-item.violation { border-left-color: #ef4444; }
    .event-item.rfid { border-left-color: #eab308; }
    .event-time { color: #64748b; font-size: 9px; white-space: nowrap; }
    .event-plate { font-weight: 600; color: #f8fafc; white-space: nowrap; }
    .event-detail { color: #94a3b8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-amount { color: #22c55e; font-weight: 600; white-space: nowrap; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <a href="/" class="back-btn">← Back</a>
      <h1><span>TollGate</span> Simulator</h1>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>RFID</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Entry</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Payment</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>Violation</div>
      <div class="legend-item" style="margin-left:8px;color:#64748b">← UP &nbsp; DOWN →</div>
    </div>
  </div>

  <div class="highway-wrap">
    <canvas id="highway" class="highway-canvas"></canvas>
  </div>

  <div class="bottom-bar">
    <div class="left-panel">
      <div>
        <div class="section-title">Statistics</div>
        <div class="stats-row">
          <div class="stat-card"><div class="stat-label">Passed</div><div class="stat-value blue" id="stat-vehicles">0</div></div>
          <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value green" id="stat-revenue">K 0</div></div>
          <div class="stat-card"><div class="stat-label">On Road</div><div class="stat-value yellow" id="stat-onhighway">0</div></div>
          <div class="stat-card"><div class="stat-label">Violations</div><div class="stat-value red" id="stat-violations">0</div></div>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-group">
          <div class="ctrl-label">Scenario</div>
          <select id="scenario"><option value="normal">Normal</option><option value="rush">Rush Hour</option><option value="holiday">Holiday</option><option value="night">Night</option></select>
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label">Count</div>
          <input type="number" id="vehicleCount" value="30" min="5" max="100" style="width:50px">
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label">Speed</div>
          <div class="speed-row">
            <span class="speed-lbl">1</span>
            <input type="range" id="speed" class="speed-slider" min="1" max="5" value="3">
            <span class="speed-lbl">5</span>
          </div>
        </div>
        <button class="btn btn-primary" id="btnStart">▶ Start</button>
        <button class="btn btn-success" id="btnPause" disabled>⏸</button>
        <button class="btn btn-danger" id="btnStop" disabled>⏹</button>
      </div>
    </div>

    <div class="log-panel">
      <div class="log-header"><div class="section-title">Event Log</div></div>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <script src="src/simulator.js"></script>
</body>
</html>
