name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/tollgate

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build shared types
        run: cd packages/shared && npm run build
      - name: Typecheck backend
        run: cd packages/backend && npx tsc --noEmit
      - name: Typecheck frontend
        run: cd packages/frontend && npx tsc --noEmit
      - name: Typecheck customer portal
        run: cd packages/customer-portal && npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tollgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tollgate_test
      JWT_SECRET: test-secret-key
      JWT_EXPIRES_IN: 1h
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build shared types
        run: cd packages/shared && npm run build
      - name: Generate Prisma client
        run: cd packages/backend && npx prisma generate
      - name: Run migrations
        run: cd packages/backend && npx prisma migrate deploy
      - name: Seed database
        run: cd packages/backend && npm run db:seed
      - name: Run tests
        run: cd packages/backend && npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/backend/coverage/

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build shared types
        run: cd packages/shared && npm run build
      - name: Build backend
        run: cd packages/backend && npm run build
      - name: Build frontend
        run: cd packages/frontend && npm run build
      - name: Build customer portal
        run: cd packages/customer-portal && npm run build
      - name: Build Docker images
        run: docker compose build
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker images
        if: github.event_name == 'push'
        run: |
          docker tag tollgaterfidpass-backend:latest ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          docker tag tollgaterfidpass-frontend:latest ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          docker tag tollgaterfidpass-customer-portal:latest ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-customer-portal:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-customer-portal:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging server
        run: |
          echo "Deploying to staging..."
          # Add your deployment commands here (SSH, rsync, docker pull, etc.)
          # Example:
          # ssh ${{ secrets.STAGING_HOST }} "cd /opt/tollgate && docker compose pull && docker compose up -d"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production server
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
