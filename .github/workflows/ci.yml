name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build shared types
        run: cd packages/shared && npm run build
      - name: Typecheck backend
        run: cd packages/backend && npx tsc --noEmit
      - name: Typecheck frontend
        run: cd packages/frontend && npx tsc --noEmit
      - name: Typecheck simulator
        run: cd packages/simulator && npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tollgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tollgate_test
      JWT_SECRET: test-secret-key
      JWT_EXPIRES_IN: 1h
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build shared types
        run: cd packages/shared && npm run build
      - name: Generate Prisma client
        run: cd packages/backend && npx prisma generate
      - name: Run migrations
        run: cd packages/backend && npx prisma migrate deploy
      - name: Seed database
        run: cd packages/backend && npm run db:seed
      - name: Run tests
        run: cd packages/backend && npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build shared types
        run: cd packages/shared && npm run build
      - name: Build backend
        run: cd packages/backend && npm run build
      - name: Build frontend
        run: cd packages/frontend && npm run build
      - name: Build simulator
        run: cd packages/simulator && npm run build
