<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TollGate RFID — System Architecture</title>
<style>
  body { margin: 0; background: #0a0e17; font-family: 'Inter', system-ui, sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
  svg text { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 800" width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f151c"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8924e"/>
      <stop offset="100%" stop-color="#d4a85a"/>

      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>

      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" rx="12"/>

  <!-- Title -->

  <text x="600" y="68" text-anchor="middle" fill="#64748b" font-size="12">6 Portals · 1 Backend · 4 Databases · 4 Plaza Sites</text>

  <!-- ============= PORTALS (Top Row) ============= -->
  <g filter="url(#shadow)">
    <!-- Admin Hub -->
    <rect x="30" y="100" width="160" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="30" y="100" width="160" height="6" rx="3" fill="url(#gold)"/>
    <text x="110" y="135" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Admin Hub</text>
    <text x="110" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">:80 · React</text>
    <text x="110" y="170" text-anchor="middle" fill="#64748b" font-size="9">SUPER_ADMIN / OPERATOR</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Customer PWA -->
    <rect x="210" y="100" width="160" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="210" y="100" width="160" height="6" rx="3" fill="#3b82f6"/>
    <text x="290" y="135" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Customer PWA</text>
    <text x="290" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">:8080 · React</text>
    <text x="290" y="170" text-anchor="middle" fill="#64748b" font-size="9">Driver / Fleet</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Financial Portal -->
    <rect x="390" y="100" width="160" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="390" y="100" width="160" height="6" rx="3" fill="#f59e0b"/>
    <text x="470" y="135" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Financial Portal</text>
    <text x="470" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">:8081 · React</text>
    <text x="470" y="170" text-anchor="middle" fill="#64748b" font-size="9">FINANCIAL_ADMIN</text>
  </g>

  <g filter="url(#shadow)">

    <text x="1010" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">:8084 · React PWA</text>
    <text x="1010" y="170" text-anchor="middle" fill="#64748b" font-size="9">Mobile Clock In/Out</text>
  </g>

  <text x="560" y="240" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">Nginx Reverse Proxy Layer (SPA Fallback · Security Headers · TLS Termination)</text>

    <text x="600" y="350" text-anchor="middle" fill="#b8924e" font-size="11">Express + TypeScript + Prisma ORM · Port 3000</text>
    <text x="600" y="370" text-anchor="middle" fill="#94a3b8" font-size="10">Auth · JWT · Rate Limiting · Zod Validation · Helmet · CORS</text>
  </g>

  <!-- Backend modules -->
  <g fill="#1e293b" stroke="#475569" stroke-width="1" rx="6">
    <rect x="370" y="395" width="100" height="30" rx="6"/>
    <text x="420" y="415" text-anchor="middle" fill="#94a3b8" font-size="9">Auth Module</text>

    <text x="690" y="548" text-anchor="middle" fill="#94a3b8" font-size="9">plaza_config · sync_queue</text>
    <text x="690" y="562" text-anchor="middle" fill="#94a3b8" font-size="9">local_toll_events · device_config</text>

    <text x="940" y="528" text-anchor="middle" fill="#c084fc" font-size="10">tollgate_hr · :5435</text>
    <text x="940" y="548" text-anchor="middle" fill="#94a3b8" font-size="9">employees · departments · attendance</text>
    <text x="940" y="562" text-anchor="middle" fill="#94a3b8" font-size="9">leave · payroll · performance</text>

  <text x="600" y="635" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">Highway Plaza Hardware (4 Sites)</text>

  <g fill="#0f151c" stroke="#475569" stroke-width="1" rx="8">
    <rect x="60" y="650" width="230" height="110" rx="8"/>

    <text x="175" y="710" text-anchor="middle" fill="#94a3b8" font-size="9">Barrier Gate · LED Sign</text>
    <text x="175" y="725" text-anchor="middle" fill="#94a3b8" font-size="9">Raspberry Pi Edge Server</text>
    <text x="175" y="745" text-anchor="middle" fill="#64748b" font-size="8">Offline → Sync Queue → Backend</text>
  </g>

  <g fill="#0f151c" stroke="#475569" stroke-width="1" rx="8">
    <rect x="320" y="650" width="230" height="110" rx="8"/>
    <text x="435" y="675" text-anchor="middle" fill="#b8924e" font-size="12" font-weight="600">39 Mile Plaza</text>
    <text x="435" y="695" text-anchor="middle" fill="#94a3b8" font-size="9">RFID Reader · ANPR Camera</text>
    <text x="435" y="710" text-anchor="middle" fill="#94a3b8" font-size="9">Barrier Gate · LED Sign</text>
    <text x="435" y="725" text-anchor="middle" fill="#94a3b8" font-size="9">Raspberry Pi Edge Server</text>
    <text x="435" y="745" text-anchor="middle" fill="#64748b" font-size="8">Offline → Sync Queue → Backend</text>
  </g>

  <g fill="#0f151c" stroke="#475569" stroke-width="1" rx="8">
    <rect x="580" y="650" width="230" height="110" rx="8"/>
    <text x="695" y="675" text-anchor="middle" fill="#b8924e" font-size="12" font-weight="600">115 Mile Plaza</text>
    <text x="695" y="695" text-anchor="middle" fill="#94a3b8" font-size="9">RFID Reader · ANPR Camera</text>
    <text x="695" y="710" text-anchor="middle" fill="#94a3b8" font-size="9">Barrier Gate · LED Sign</text>
    <text x="695" y="725" text-anchor="middle" fill="#94a3b8" font-size="9">Raspberry Pi Edge Server</text>
    <text x="695" y="745" text-anchor="middle" fill="#64748b" font-size="8">Offline → Sync Queue → Backend</text>
  </g>

  <g fill="#0f151c" stroke="#475569" stroke-width="1" rx="8">
    <rect x="840" y="650" width="230" height="110" rx="8"/>
    <text x="955" y="675" text-anchor="middle" fill="#b8924e" font-size="12" font-weight="600">200 Mile Plaza</text>
    <text x="955" y="695" text-anchor="middle" fill="#94a3b8" font-size="9">RFID Reader · ANPR Camera</text>
    <text x="955" y="710" text-anchor="middle" fill="#94a3b8" font-size="9">Barrier Gate · LED Sign</text>
    <text x="955" y="725" text-anchor="middle" fill="#94a3b8" font-size="9">Raspberry Pi Edge Server</text>
    <text x="955" y="745" text-anchor="middle" fill="#64748b" font-size="8">Offline → Sync Queue → Backend</text>
  </g>

  <!-- Portals to Nginx -->
  <g stroke="#475569" stroke-width="1" fill="none" stroke-dasharray="4,3">
    <line x1="110" y1="180" x2="110" y2="210"/>
    <line x1="290" y1="180" x2="290" y2="210"/>
    <line x1="470" y1="180" x2="470" y2="210"/>
    <line x1="650" y1="180" x2="650" y2="210"/>
    <line x1="830" y1="180" x2="830" y2="210"/>
    <line x1="1010" y1="180" x2="1010" y2="210"/>
  </g>

  <!-- Nginx to Backend -->
  <g stroke="#b8924e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="600" y1="260" x2="600" y2="290"/>
  </g>

  <!-- Backend to DBs -->
  <g stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <line x1="500" y1="390" x2="190" y2="480"/>
    <line x1="550" y1="390" x2="440" y2="480"/>

  <g stroke="#22c55e" stroke-width="1" fill="none" stroke-dasharray="6,3">

    <line x1="520" y1="425" x2="435" y2="650"/>

      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>

  </defs>

  <!-- ============= LABELS ============= -->
  <text x="600" y="280" text-anchor="middle" fill="#b8924e" font-size="9" font-weight="600">HTTPS / HTTP</text>
  <text x="350" y="460" fill="#64748b" font-size="9">Prisma Client</text>
  <text x="550" y="460" fill="#22c55e" font-size="9">Sync API</text>
</svg>
</body>
</html>
