services:
  # ── Main HQ Database (vehicles, toll events, plazas, violations) ──
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tollgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tollgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Customer Portal Database (accounts, wallets, transactions) ──
  customer-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tollgate_customer
    ports:
      - "5433:5432"
    volumes:
      - customer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tollgate_customer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Plaza Sync Database (sync queue, plaza config, local events) ──
  plaza-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tollgate_plaza
    ports:
      - "5434:5432"
    volumes:
      - plaza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tollgate_plaza"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API Server ──
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      # HQ Database
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tollgate
      # Customer Database
      CUSTOMER_DATABASE_URL: postgresql://postgres:postgres@customer-db:5432/tollgate_customer
      # Plaza Database
      PLAZA_DATABASE_URL: postgresql://postgres:postgres@plaza-db:5432/tollgate_plaza
      # Auth
      JWT_SECRET: docker-dev-secret-key
      JWT_EXPIRES_IN: 24h
      NODE_ENV: development
      # Payment Gateways
      KBZ_PAY_MERCHANT_ID: ${KBZ_PAY_MERCHANT_ID:-}
      KBZ_PAY_APP_ID: ${KBZ_PAY_APP_ID:-}
      KBZ_PAY_SECRET_KEY: ${KBZ_PAY_SECRET_KEY:-}
      KBZ_PAY_API_URL: ${KBZ_PAY_API_URL:-https://api.kbzpay.com}
      KBZ_PAY_NOTIFY_URL: http://localhost:3000/api/payments/kbzpay/callback
      WAVE_PAY_MERCHANT_ID: ${WAVE_PAY_MERCHANT_ID:-}
      WAVE_PAY_SECRET_KEY: ${WAVE_PAY_SECRET_KEY:-}
      WAVE_PAY_API_URL: ${WAVE_PAY_API_URL:-https://testpayments.wavemoney.io:8107}
      WAVE_PAY_NOTIFY_URL: http://localhost:3000/api/payments/wavepay/callback
      MMQR_MERCHANT_ID: ${MMQR_MERCHANT_ID:-}
      MMQR_API_KEY: ${MMQR_API_KEY:-}
      MMQR_API_URL: ${MMQR_API_URL:-https://api.mmqr.com}
      MMQR_NOTIFY_URL: http://localhost:3000/api/payments/mmqr/callback
      FRONTEND_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      customer-db:
        condition: service_healthy
      plaza-db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Admin Dashboard (Nginx) ──
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Customer Portal (Nginx) ──
  customer-portal:
    build:
      context: .
      dockerfile: packages/customer-portal/Dockerfile
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Financial Portal (Nginx) ──
  financial-portal:
    build:
      context: .
      dockerfile: packages/financial-portal/Dockerfile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Highway Simulator (optional) ──
  simulator:
    build:
      context: .
      dockerfile: packages/simulator/Dockerfile
    environment:
      API_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata:
  customer_pgdata:
  plaza_pgdata:
  uploads:
